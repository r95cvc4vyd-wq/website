<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Launch Lars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            background-color: #020005;
            overflow: hidden;
            position: relative;
        }

        /* Canvas für die lodernden Flammen */
        #fireCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Vignetten-Overlay für Fokus auf den Text */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.2) 0%, rgba(2, 0, 5, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            padding: 20px;
        }

        /* Logo / Bild über dem Countdown */
        .header-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%; /* Macht das Bild kreisrund */
            margin-bottom: 25px;
            border: 2px solid rgba(255, 120, 0, 0.4);
            box-shadow: 0 0 25px rgba(255, 80, 0, 0.4);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            background: rgba(0, 0, 0, 0.6);
            padding: 18px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 120, 0, 0.25);
            box-shadow: 0 4px 30px rgba(255, 60, 0, 0.25);
        }

        .number {
            font-size: 3.5rem;
            font-weight: 200;
            line-height: 1;
            text-shadow: 0 0 18px rgba(255, 140, 0, 0.9);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            opacity: 0.75;
            color: #ffcca0;
        }

        .text-section {
            font-weight: 300;
            letter-spacing: 1px;
        }

        .text-section p:first-child {
            font-size: 1.4rem;
            margin-bottom: 8px;
            opacity: 0.85;
            font-weight: 300;
        }

        .text-section p:last-child {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 80, 0, 0.7);
        }

        @media (max-width: 600px) {
            .header-image { width: 90px; height: 90px; margin-bottom: 20px; }
            .number { font-size: 2.5rem; }
            .time-box { min-width: 65px; padding: 12px 6px; }
            .countdown { gap: 10px; }
            .text-section p:first-child { font-size: 1.1rem; }
            .text-section p:last-child { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="fireCanvas"></canvas>
    <div class="overlay"></div>

    <div class="container">
        <!-- BILD ÜBER DEM COUNTDOWN (Ersetze 'logo.jpg' durch den Namen deines Bildes) -->
        <img src="logo.png" alt="Logo" class="header-image">

        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">0000</span>
                <span class="label">Tage</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Stunden</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minuten</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekunden</span>
            </div>
        </div>

        <div class="text-section">
            <p>seid gespannt</p>
            <p>Live Launch Lars</p>
        </div>
    </div>

    <script>
        // --- COUNTDOWN LOGIK ---
        const targetDate = new Date("May 1, 2030 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.querySelector(".countdown").innerHTML = "<h2>Der Launch hat begonnen!</h2>";
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // --- REALISTISCHER FLAMMEN- & SPARKS-ANIMATION ---
        const canvas = document.getElementById("fireCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const flameParticles = [];
        const sparkParticles = [];
        const flameCount = 200;
        const sparkCount = 60;

        class FlameParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 40;
                this.size = Math.random() * 45 + 25;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 1.8;
                this.life = 1;
                this.maxLife = Math.random() * 0.5 + 0.5;
                this.decay = Math.random() * 0.01 + 0.006;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * this.wobbleSpeed) * 0.8 + this.speedX;
                this.life -= this.decay;
                this.size *= 0.98;

                if (this.life <= 0 || this.size <= 2) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size
                );

                const alpha = Math.max(0, this.life);
                gradient.addColorStop(0, `rgba(255, 255, 200, ${alpha * 0.8})`);
                gradient.addColorStop(0.2, `rgba(255, 180, 0, ${alpha * 0.6})`);
                gradient.addColorStop(0.6, `rgba(230, 40, 0, ${alpha * 0.3})`);
                gradient.addColorStop(1, `rgba(40, 0, 0, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }
        }

        class SparkParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height - Math.random() * 100;
                this.size = Math.random() * 2.5 + 1;
                this.speedY = Math.random() * 5 + 3;
                this.speedX = (Math.random() - 0.5) * 3;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.life -= this.decay;

                if (this.life <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 80, ${this.life})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#ff8800";
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < flameCount; i++) flameParticles.push(new FlameParticle());
        for (let i = 0; i < sparkCount; i++) sparkParticles.push(new SparkParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            const baseGlow = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - 150);
            baseGlow.addColorStop(0, "rgba(255, 100, 0, 0.4)");
            baseGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
            ctx.fillStyle = baseGlow;
            ctx.fillRect(0, canvas.height - 150, canvas.width, 150);
            ctx.restore();

            flameParticles.forEach(p => { p.update(); p.draw(); });
            sparkParticles.forEach(p => { p.update(); p.draw(); });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
