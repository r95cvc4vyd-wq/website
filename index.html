<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Launch Lars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            background-color: #030106;
            overflow: hidden;
            position: relative;
        }

        /* Canvas für das lodernde Feuer */
        #fireCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Sanfte Abdunklung, damit die Schrift immer perfekt lesbar ist */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.25) 0%, rgba(3, 1, 6, 0.85) 100%);
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            padding: 20px;
        }

        /* Schlichter Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            background: rgba(0, 0, 0, 0.55);
            padding: 16px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 100, 0, 0.2);
            box-shadow: 0 4px 25px rgba(255, 60, 0, 0.2);
        }

        .number {
            font-size: 3.5rem;
            font-weight: 200;
            line-height: 1;
            text-shadow: 0 0 15px rgba(255, 120, 0, 0.8);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            opacity: 0.75;
            color: #ffccaa;
        }

        /* Schlichte Typografie für die Zeilen darunter */
        .text-section {
            font-weight: 300;
            letter-spacing: 1px;
        }

        .text-section p:first-child {
            font-size: 1.4rem;
            margin-bottom: 8px;
            opacity: 0.85;
            font-weight: 300;
        }

        .text-section p:last-child {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 80, 0, 0.6);
        }

        /* Responsives Layout für Smartphones */
        @media (max-width: 600px) {
            .number { font-size: 2.5rem; }
            .time-box { min-width: 65px; padding: 12px 6px; }
            .countdown { gap: 10px; }
            .text-section p:first-child { font-size: 1.1rem; }
            .text-section p:last-child { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Animierter Flammen-Hintergrund -->
    <canvas id="fireCanvas"></canvas>
    
    <!-- Filter über dem Feuer -->
    <div class="overlay"></div>

    <div class="container">
        <!-- Countdown -->
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">0000</span>
                <span class="label">Tage</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Stunden</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minuten</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekunden</span>
            </div>
        </div>

        <!-- Schlichter Text -->
        <div class="text-section">
            <p>seid gespannt</p>
            <p>Live Launch Lars</p>
        </div>
    </div>

    <script>
        // --- COUNTDOWN LOGIK (Ziel: 01.05.2030) ---
        const targetDate = new Date("May 1, 2030 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.querySelector(".countdown").innerHTML = "<h2>Der Launch hat begonnen!</h2>";
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // --- ANIMATION: LODERNDE FLAMMEN ---
        const canvas = document.getElementById("fireCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const particles = [];
        const particleCount = 160; // Dichte der Flammenpartikel

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 60;
                this.size = Math.random() * 32 + 16;
                this.speedY = Math.random() * 3.5 + 1.5;
                this.speedX = (Math.random() - 0.5) * 2;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                
                // Farbschema: Von hellem Gelb/Orange bis zu tiefem Feuerrot
                const r = 255;
                const g = Math.floor(Math.random() * 150);
                const b = 0;
                this.color = `rgba(${r}, ${g}, ${b},`;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.015) * 0.6; // Leichtes lodern/wehen
                this.life -= this.decay;
                this.size *= 0.975; // Partikel verjüngen sich nach oben

                if (this.life <= 0 || this.size <= 1) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.life + ")";
                ctx.globalCompositeOperation = "lighter"; // Erzeugt das typische Glühen
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateFire() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateFire);
        }

        animateFire();
    </script>
</body>
</html>
