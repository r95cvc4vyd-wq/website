<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Launch Lars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            background-color: #05020a;
            overflow: hidden;
            position: relative;
        }

        /* Canvas für die Flammen-Partikel */
        #fireCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Abdunklungs-Overlay für bessere Lesbarkeit */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            padding: 20px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(255, 85, 0, 0.15);
        }

        .number {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1;
            text-shadow: 0 0 15px rgba(255, 120, 0, 0.6);
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            opacity: 0.75;
        }

        .text-section {
            font-weight: 300;
            letter-spacing: 1px;
        }

        .text-section p:first-child {
            font-size: 1.5rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .text-section p:last-child {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
        }

        @media (max-width: 600px) {
            .number { font-size: 2.5rem; }
            .time-box { min-width: 65px; padding: 10px 5px; }
            .countdown { gap: 10px; }
            .text-section p:first-child { font-size: 1.2rem; }
            .text-section p:last-child { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="fireCanvas"></canvas>
    <div class="overlay"></div>

    <div class="container">
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Tage</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Stunden</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minuten</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekunden</span>
            </div>
        </div>

        <div class="text-section">
            <p>Seid gespannt</p>
            <p>Live Launch Lars</p>
        </div>
    </div>

    <script>
        // --- COUNTDOWN LOGIK ---
        const targetDate = new Date("May 1, 2030 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.querySelector(".countdown").innerHTML = "<h2>Der Launch hat begonnen!</h2>";
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // --- ANIMIERTER FLAMMEN-HINTERGRUND ---
        const canvas = document.getElementById("fireCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const particleCount = 120; // Anzahl der Feuerpartikel

                this.reset();
            }

                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;

                this.speedY = Math.random() * 3 + 1.5;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.005;
